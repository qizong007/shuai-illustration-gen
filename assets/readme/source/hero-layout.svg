<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">shuai-illustration-gen — 把想法，画成插画。</title>
  <desc id="desc">三张真实生成示例：共享根系的树、负重的人与幼苗、平衡电脑与喇叭的天平。暖米白背景、黑白剪纸和有分量的朱红强调，形成统一的编辑插画风格。</desc>
  <rect width="1200" height="780" fill="#FBF8F1"/>
  <g id="identity" fill="#171717" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif">
    <path d="M52 42 L75 39 L73 65 L50 68 Z" fill="#D32918"/>
    <text x="91" y="63" font-size="30" font-weight="600" letter-spacing="-.7">shuai-illustration-gen</text>
    <text x="50" y="167" font-size="68" font-weight="700" letter-spacing="-2">把想法，画成<tspan fill="#D32918">插画。</tspan></text>
    <text x="54" y="226" font-size="30">一个主题，一套统一的插画语言。</text>
  </g>
  <g id="real-output-specimens">
    <image x="40" y="282" width="368" height="245.333" xlink:href="shared-roots.png"/>
    <image x="416" y="282" width="368" height="245.333" xlink:href="burden-and-growth.png"/>
    <image x="792" y="282" width="368" height="245.333" xlink:href="build-and-sell.png"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#171717" font-size="28" text-anchor="middle">
      <text x="224" y="577">积累与复用</text>
      <text x="600" y="577">责任与成长</text>
      <text x="976" y="577">创造与销售</text>
    </g>
  </g>
  <g id="style-signature">
    <path d="M54 622 H1146" stroke="#BDB9B0" stroke-width="1"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans CJK SC', sans-serif" fill="#171717">
      <text x="54" y="681" font-size="30">米白纸底 · 黑白主体 · 朱红强调</text>
      <text x="54" y="726" font-size="25">手工剪纸拼贴 / 细腻印刷颗粒 / 概念隐喻</text>
    </g>
    <g id="palette" transform="translate(848 660)">
