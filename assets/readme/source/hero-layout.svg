<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">shuai-illustration-gen — 把想法，画成插画。</title>
  <desc id="desc">黑色铅笔的纸带笔触化为一只朱红翅膀的飞鸟，用剪纸拼贴表达从想法到图像的过程。</desc>
  <defs>
    <clipPath id="canvas"><rect width="1200" height="420" rx="24"/></clipPath>
    <linearGradient id="blend" x1="0" x2="1"><stop offset="0" stop-color="#FBF8F1"/><stop offset="1" stop-color="#FBF8F1" stop-opacity="0"/></linearGradient>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1200" height="420" fill="#FBF8F1"/>
    <g id="generated-art">
      <image x="580" y="0" width="630" height="420" xlink:href="hero-art.png"/>
      <rect x="580" width="100" height="420" fill="url(#blend)"/>
    </g>
    <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" fill="#171717">
      <path d="M54 43 L73 41 L72 61 L53 63 Z" fill="#D32918"/>
      <text x="88" y="62" font-size="27" font-weight="650" letter-spacing="-.5">shuai-illustration-gen</text>
      <text x="50" y="162" font-size="70" font-weight="750" letter-spacing="-2">把想法，</text>
      <text x="50" y="245" font-size="70" font-weight="750" letter-spacing="-2">画成<tspan fill="#D32918">插画。</tspan></text>
      <text x="54" y="307" font-size="25" font-weight="500">米白纸底 · 黑白剪纸 · 朱红强调</text>
      <text x="54" y="367" font-size="20">文章配图 / 概念表达 / 系列插画</text>
    </g>
  </g>
</svg>
